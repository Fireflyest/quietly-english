[workspace]
resolver = "2"
members = [
    "crates/qe-core",
    "crates/qe-store",
    "crates/qe-tui",
    "crates/qe-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["quietly contributors"]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
csv = "1.3"
dirs = "5.0"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
