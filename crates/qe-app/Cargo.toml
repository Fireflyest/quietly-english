[package]
name = "quietly"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "quietly"
path = "src/main.rs"

[dependencies]
qe-core = { path = "../qe-core" }
qe-store = { path = "../qe-store" }
qe-tui = { path = "../qe-tui" }
anyhow.workspace = true
chrono.workspace = true
crossterm.workspace = true
hmac.workspace = true
md-5.workspace = true
minreq.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
# 读「系统代理」开关（代理软件写进注册表的值）；不设环境变量时靠它走代理。
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
